services:
  - type: web
    name: nudge-ai
    runtime: python
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
