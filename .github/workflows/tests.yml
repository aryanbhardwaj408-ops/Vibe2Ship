name: Backend and frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall -q backend tests
      - name: Check frontend JavaScript syntax
        run: node --check script.js && node --check calendar.js
      - name: Run tests
        run: python -m pytest -q
